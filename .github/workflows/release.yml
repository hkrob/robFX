name: Release

# Publishes a signed APK as a GitHub release. The app's built-in updater reads the latest release,
# so this is what "shipping an update" means.
#
# It runs by itself: bump versionCode and versionName in app/build.gradle.kts, add a "## <version>"
# section to changelog/CHANGELOG.md, and push to main. A version that is already released is skipped.
# It can also be run by hand (Actions -> Release -> Run workflow) or by pushing a matching tag (v1.7.0).

on:
  push:
    branches: [main]
    paths: ["app/build.gradle.kts"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the signing certificate. A build signed by anything else would be refused by phones that
  # already have robFX installed, so the job stops instead of publishing it.
  EXPECTED_SIGNER: 9baf6701c1ece2451d07c0f8c19a45b5509e8538bed94e16ae7cb95fea9f0afe

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and whether it needs releasing
        id: v
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$VERSION" ] || { echo "::error::Could not read versionName from app/build.gradle.kts"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION}"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            # A push that didn't change the version (or a re-run) is not an error: there is simply nothing to do.
            echo "::notice::v${VERSION} is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from the changelog
        run: |
          # Everything under "## <version>" up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / { on = ($2 == v || $2 == "v" v) ; next }
            on { print }
          ' changelog/CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::changelog/CHANGELOG.md has no '## ${VERSION}' section. Add one describing this version."; exit 1
          fi
          cat notes.md

      - name: Check signing secrets
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::Repository secret $s is not set (Settings -> Secrets and variables -> Actions)"; exit 1; }
          done
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write signing config
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/robfx.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/robfx.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Test, lint and build the release APK
        run: |
          chmod +x gradlew
          # Robolectric downloads its Android runtime from Maven on first use, and that fetch occasionally fails on the
          # runner. One retry after a pause, so a network hiccup doesn't silently skip a release (1.7.5 was lost that way).
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease || {
            echo "::warning::Build failed, retrying once in 60s"
            sleep 60
            ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          }

      - name: Verify the signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          OUT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")
          echo "$OUT"
          echo "$OUT" | grep -qi "certificate SHA-256 digest: ${EXPECTED_SIGNER}" \
            || { echo "::error::APK is not signed with the expected key"; exit 1; }

      - name: Name the artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk "robFX-${VERSION}.apk"
          sha256sum "robFX-${VERSION}.apk" > "robFX-${VERSION}.apk.sha256"

      - name: Publish the release
        run: |
          gh release create "v${VERSION}" "robFX-${VERSION}.apk" "robFX-${VERSION}.apk.sha256" \
            --title "robFX ${VERSION}" --target "${GITHUB_SHA}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
