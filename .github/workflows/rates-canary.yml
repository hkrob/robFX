name: Rate canary

# Every 6 hours, query each rate source from outside the app (tools/rates_canary.py). A failed run means a source broke,
# went stale or drifted, and GitHub emails the repository owner about failed scheduled runs.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/rates_canary.py
